<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Grade 1 Brain Play + Voice</title><style>html,body,iframe{margin:0;width:100%;height:100%;border:0;overflow:hidden}#voice{position:fixed;z-index:9999;right:72px;bottom:10px;border:0;border-radius:999px;background:#fff;color:#173a78;padding:10px 16px;font:900 17px system-ui;box-shadow:0 4px 18px #0005;cursor:pointer}</style></head><body><iframe id="game" src="../brainplay1/"></iframe><button id="voice" onclick="speak()">🔊 Listen</button><script>function speak(){const f=document.getElementById('game');let d;try{d=f.contentDocument}catch(e){return}const q=d&&d.querySelector('.q');if(!q)return;speechSynthesis.cancel();let text=q.textContent.replace(/___/g,' blank ');const u=new SpeechSynthesisUtterance(text);u.lang='en-US';u.rate=.82;u.pitch=1.06;const vs=speechSynthesis.getVoices();u.voice=vs.find(v=>/Samantha|Google US English|Microsoft Aria/i.test(v.name))||vs.find(v=>/^en[-_](US|GB)/i.test(v.lang))||null;speechSynthesis.speak(u)}</script></body></html>
