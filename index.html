<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Grade 1 Adventure</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,Segoe UI,Arial;background:radial-gradient(circle at top,#214b94,#061226 60%);color:#fff;min-height:100vh}.app{max-width:960px;margin:auto;padding:14px;min-height:100vh;display:flex;flex-direction:column}.top{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}.brand{font-size:clamp(24px,5vw,38px);font-weight:900}.stats{display:flex;gap:7px;flex-wrap:wrap}.p{background:#ffffff17;border:1px solid #ffffff28;padding:7px 10px;border-radius:999px;font-weight:800}.prog{height:13px;background:#ffffff18;border-radius:20px;overflow:hidden;margin:12px 0}.bar{height:100%;background:linear-gradient(90deg,#3de294,#ffe05b);width:0;transition:.3s}.worlds{display:flex;justify-content:space-between;margin-bottom:10px}.w{opacity:.35;text-align:center;font-size:12px;font-weight:800}.w.on{opacity:1}.dot{font-size:25px;display:block}.card{flex:1;background:linear-gradient(145deg,#143369,#0d2148);border:1px solid #ffffff25;border-radius:28px;padding:clamp(20px,5vw,40px);display:flex;flex-direction:column;justify-content:center;box-shadow:0 20px 60px #0007}.tag{color:#ffdc5b;font-weight:900}.q{font-size:clamp(24px,4vw,40px);font-weight:900;margin:10px 0}.v{text-align:center;font-size:clamp(38px,8vw,68px);white-space:pre-line;background:#ffffff0b;padding:14px;border-radius:18px;margin:7px 0 16px}.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}.o,.tile{border:2px solid #ffffff24;background:#ffffff10;color:white;padding:15px;border-radius:17px;font-size:clamp(17px,2.5vw,21px);font-weight:800;cursor:pointer}.o.sel{outline:3px solid #ffdc5b}.o.good{background:#117b47}.o.bad{background:#8d2840}.feed{margin-top:13px;background:#07162e;padding:12px;border-radius:14px;color:#c7d7ff;min-height:55px}.actions{display:flex;justify-content:flex-end;margin-top:10px}.btn,.go{border:0;border-radius:15px;background:#ffdc5b;padding:13px 20px;font-weight:900;font-size:17px;cursor:pointer}.go{font-size:21px}.build{min-height:64px;border:2px dashed #ffffff4c;border-radius:17px;display:flex;justify-content:center;align-items:center;font-size:34px;font-weight:900;margin-bottom:10px}.tiles{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}.tile{min-width:70px;font-size:27px}.tile.used{opacity:.25;pointer-events:none}.start,.finish{text-align:center}.hero{font-size:80px}.start h1,.finish h1{font-size:clamp(34px,7vw,60px);margin:5px}.start p,.finish p{font-size:18px;color:#c7d7ff}.fs{position:fixed;right:10px;bottom:10px;border:1px solid #ffffff34;background:#0d214bdd;color:#fff;border-radius:999px;padding:9px 12px}@media(max-width:620px){.opts{grid-template-columns:1fr}.w b{display:none}.card{border-radius:20px}}</style></head><body><main class="app"><div class="top"><div class="brand">🎮 Grade 1 Adventure</div><div class="stats"><span class="p">⭐ <b id="xp">0</b></span><span class="p">🔥 <b id="st">0</b></span><span class="p">❤️ <b id="hp">5</b></span><span class="p"><b id="n">0</b>/50</span></div></div><div class="prog"><div class="bar" id="bar"></div></div><div class="worlds" id="worlds"></div><section class="card" id="card"></section></main><button class="fs" onclick="fs()">⛶ Full screen</button><script>
const W=['🔷 Shapes','🔢 Numbers','🔤 Letters','🧩 Words','🚀 English'];
const Q=[
['c','Which shape has 5 sides?','⬟',['Pentagon','Hexagon','Circle','Cube'],'Pentagon','A pentagon has 5 sides.'],
['c','Which shape has 6 sides?','⬢',['Triangle','Pentagon','Hexagon','Sphere'],'Hexagon','A hexagon has 6 sides.'],
['c','Which one is a 3D shape?','🧊',['Cube','Square','Triangle','Pentagon'],'Cube','A cube is a solid 3D shape.'],
['c','A football is most like which 3D shape?','⚽',['Sphere','Cube','Cylinder','Cone'],'Sphere','A sphere is round like a ball.'],
['c','A drink can is most like which shape?','🥫',['Cylinder','Cone','Sphere','Cube'],'Cylinder','A can is cylinder-shaped.'],
['c','An ice-cream cone is most like which shape?','🍦',['Cone','Sphere','Cube','Cylinder'],'Cone','It has a pointed top like a cone.'],
['m','Tap ALL the pentagons.','⬟  ⬢  ⬟  ●  ⬟',['⬟ #1','⬢ #2','⬟ #3','● #4','⬟ #5'],['⬟ #1','⬟ #3','⬟ #5'],'Pentagon = 5 sides.'],
['m','Tap ALL the hexagon-like objects.','🍯  ⚽  🔩  ⭐',['Honeycomb 🍯','Football ⚽','Nut 🔩','Star ⭐'],['Honeycomb 🍯','Nut 🔩'],'Honeycomb cells and nuts can look hexagonal.'],
['c','What comes next?','⬟  ⬢  ⬟  ⬢  ?',['⬟','⬢','●','■'],'⬟','The pattern repeats pentagon, hexagon.'],
['c','Which object best matches a cube?','🧊',['Toy block','Football','Party hat','Drink can'],'Toy block','A block has cube-like flat faces.'],
['c','The bird is ___ the birdhouse.','🐦\n🏠',['above','below'],'above','Above means higher.'],
['c','The fish is ___ the boat.','🚤\n🐟',['above','below'],'below','Below means lower.'],
['c','Which is longer?','✏️────────   🧽──',['Pencil','Eraser'],'Pencil','The pencil is longer.'],
['c','Which is longer?','🦒     🐶',['Giraffe','Dog'],'Giraffe','The giraffe is taller/longer.'],
['c','How many elephants?','🐘🐘🐘🐘🐘\n🐘🐘🐘🐘🐘\n🐘🐘🐘🐘🐘',['12','14','15','16'],'15','3 rows of 5 makes 15.'],
['c','What number comes BEFORE 8?','? → 8',['6','7','9','10'],'7','7 comes before 8.'],
['c','What number comes AFTER 8?','8 → ?',['6','7','9','10'],'9','9 comes after 8.'],
['c','What number comes BEFORE 5?','? → 5',['3','4','6','7'],'4','4 comes before 5.'],
['c','What number comes AFTER 9?','9 → ?',['8','10','11','7'],'10','10 comes after 9.'],
['s','Tap from smallest to biggest.','9   7   8',['9','7','8'],['7','8','9'],'Count forward: 7, 8, 9.'],
['c','Which is the uppercase H?','🍔 Hamburger',['H','h','S','U'],'H','Uppercase H is H.'],
['c','Which is the lowercase h?','🍔 Hamburger',['H','h','u','s'],'h','Lowercase H is h.'],
['m','Tap ALL H and h letters.','Find the H family!',['H','b','h','S','H','u'],['H','h','H'],'H and h are the same letter family.'],
['c','Which word begins with H?','🍔',['hamburger','sun','urchin','cat'],'hamburger','Hamburger starts with H.'],
['c','Which is the uppercase S?','☀️ sun',['S','s','H','U'],'S','Uppercase S is S.'],
['c','Which word begins with S?','⭐',['star','urchin','hat','cat'],'star','Star starts with S.'],
['m','Tap ALL words that begin with S.','🔎',['star','spider','snail','snake','hat','bun'],['star','spider','snail','snake'],'Listen for the S sound.'],
['c','Which is the uppercase U?','U is for Urchin',['U','u','H','S'],'U','Uppercase U is U.'],
['c','Which is the lowercase u?','🦔 urchin',['n','u','v','h'],'u','Lowercase U is u.'],
['b','Build the word SUN.','☀️',['N','S','U'],'SUN','S + U + N.'],
['c','Which word belongs to the -at family?','🎩',['hat','sun','bun','dog'],'hat','Hat ends with -at.'],
['c','Which word names this animal?','🐀',['rat','hat','sat','map'],'rat','Rat = 🐀.'],
['c','Complete: The rat ___ .','🐀🪑',['sat','hat','rat','sun'],'sat','Sat tells what the rat did.'],
['c','Complete: The rat sat on a ___ .','🐀 🎩',['hat','rat','sat','bun'],'hat','The rat sat on a hat.'],
['b','Build the word CAT.','🐱',['T','C','A'],'CAT','C + A + T.'],
['b','Build the word MAP.','🗺️',['P','M','A'],'MAP','M + A + P.'],
['c','Which word matches the picture?','☀️',['sun','shun','stun'],'sun','The picture is the sun.'],
['c','Which word means moving fast on your feet?','🏃',['run','rug','rut'],'run','Run means move quickly.'],
['c','Which word matches the picture?','🥯',['bun','but','ban'],'bun','This is a bun.'],
['m','Tap ALL CVC words.','CVC = consonant + vowel + consonant',['bat','sun','dog','bus','cat','map','star'],['bat','sun','dog','bus','cat','map'],'These are simple CVC words.'],
['c','Which word matches this picture?','📺',['TV','school','maths','reading'],'TV','📺 means TV.'],
['c','Which word matches this picture?','🏫',['school','pizza','trains','sand'],'school','🏫 means school.'],
['c','Which word matches this picture?','🎨',['art','maths','reading','football'],'art','Paint and brushes belong to art.'],
['c','Which word matches this picture?','🏊',['swimming','reading','trains','school'],'swimming','🏊 means swimming.'],
['c','Which word matches this picture?','🍕',['pizza','crisps','ice cream','sand'],'pizza','🍕 means pizza.'],
['c','Which word matches this picture?','⚽',['football','trains','dinosaurs','maths'],'football','⚽ means football.'],
['c','Choose the correct sentence.','🙂 🍕',['I like pizza.','I don’t like pizza.'],'I like pizza.','The happy face means “I like …”.'],
['c','Choose the correct sentence.','🙁 🔊',['I like loud sounds.','I don’t like loud sounds.'],'I don’t like loud sounds.','The unhappy face means “I don’t like …”.'],
['c','Read and choose: “This is a rat.”','Which picture?',['🐀','🎩','☀️','🐱'],'🐀','Rat = 🐀.'],
['c','FINAL BOSS: Which sentence is correct?','🐀 ➜ 🎩',['The rat sat on a hat.','The hat sat on a rat.','The sun sat on a hat.','The rat is a sun.'],'The rat sat on a hat.','Great reading! The rat sat on a hat.']
];
let i=0,xp=0,st=0,hp=5,lock=false,sel=[],built='',seq=[];const $=x=>document.getElementById(x),card=$('card');
function worlds(){ $('worlds').innerHTML=W.map((x,k)=>`<div class="w" id="w${k}"><span class="dot">${x.split(' ')[0]}</span><b>${x.substring(2)}</b></div>`).join('') }
function upd(){ $('xp').textContent=xp;$('st').textContent=st;$('hp').textContent=hp;$('n').textContent=Math.min(i,50);$('bar').style.width=Math.min(i,50)*2+'%';for(let k=0;k<5;k++)$('w'+k).classList.toggle('on',i>=k*10)}
function start(){i=0;xp=0;st=0;hp=5;render()}
function render(){lock=false;sel=[];built='';seq=[];upd();if(i===50)return finish();let q=Q[i],t=q[0],body='';if(t==='c'||t==='m')body=`<div class="opts">${q[3].map((o,k)=>`<button class="o" data-k="${k}">${o}</button>`).join('')}</div>`;if(t==='b')body=`<div class="build" id="build">_ _ _</div><div class="tiles">${q[3].map((o,k)=>`<button class="tile" data-k="${k}">${o}</button>`).join('')}</div>`;if(t==='s')body=`<div class="build" id="build">? → ? → ?</div><div class="tiles">${q[3].map((o,k)=>`<button class="tile" data-k="${k}">${o}</button>`).join('')}</div>`;card.innerHTML=`<div class="tag">${W[Math.floor(i/10)]} · Mission ${i+1}</div><div class="q">${q[1]}</div><div class="v">${q[2]}</div>${body}<div class="feed" id="feed">💡 ${t==='m'?'Choose all correct answers, then CHECK.':t==='b'?'Tap letters in the right order.':t==='s'?'Tap numbers in order.':'Choose the best answer.'}</div><div class="actions" id="act"></div>`;bind(q)}
function bind(q){let t=q[0];if(t==='c')document.querySelectorAll('.o').forEach(b=>b.onclick=()=>choice(b,q));if(t==='m'){document.querySelectorAll('.o').forEach(b=>b.onclick=()=>{b.classList.toggle('sel');sel=[...document.querySelectorAll('.o.sel')].map(x=>q[3][+x.dataset.k])});$('act').innerHTML='<button class="btn" onclick="multi()">CHECK ✓</button>'}if(t==='b')document.querySelectorAll('.tile').forEach(b=>b.onclick=()=>{if(lock||b.classList.contains('used'))return;b.classList.add('used');built+=q[3][+b.dataset.k];$('build').textContent=built.split('').join(' ');if(built.length===q[4].length)res(built===q[4],q)});if(t==='s')document.querySelectorAll('.tile').forEach(b=>b.onclick=()=>{if(lock||b.classList.contains('used'))return;b.classList.add('used');seq.push(q[3][+b.dataset.k]);$('build').textContent=seq.join(' → ');if(seq.length===q[4].length)res(seq.join()==q[4].join(),q)})}
function choice(b,q){if(lock)return;lock=true;let v=q[3][+b.dataset.k],ok=v===q[4];document.querySelectorAll('.o').forEach((x,k)=>{x.disabled=true;if(q[3][k]===q[4])x.classList.add('good')});if(!ok)b.classList.add('bad');res(ok,q)}
function multi(){if(lock)return;let q=Q[i];lock=true;let a=[...sel].sort().join('|'),z=[...q[4]].sort().join('|');document.querySelectorAll('.o').forEach((b,k)=>{let v=q[3][k];b.disabled=true;if(q[4].includes(v))b.classList.add('good');else if(b.classList.contains('sel'))b.classList.add('bad')});res(a===z,q)}
function res(ok,q){lock=true;if(ok){st++;xp+=100+Math.min(st,5)*20;$('feed').innerHTML='✅ <b>Great!</b><br>'+q[5]}else{st=0;hp=Math.max(0,hp-1);$('feed').innerHTML='❌ <b>Nice try!</b><br>'+q[5]}$('act').innerHTML='<button class="btn" onclick="next()">Next ➜</button>';upd()}
function next(){i++;render()}function finish(){upd();$('n').textContent=50;$('bar').style.width='100%';card.innerHTML=`<div class="finish"><div class="hero">🏆</div><h1>Adventure Complete!</h1><p>You finished all 50 missions across 5 worlds.</p><h2>${xp>=6000?'🏆 SUPER STAR':xp>=5000?'🥇 WORD HERO':'🥈 SMART EXPLORER'}</h2><p style="font-size:30px">⭐ ${xp} XP</p><button class="go" onclick="start()">🔄 Play Again</button></div>`}function fs(){if(!document.fullscreenElement)document.documentElement.requestFullscreen?.();else document.exitFullscreen?.()}worlds();upd();card.innerHTML='<div class="start"><div class="hero">🧒🚀</div><h1>Grade 1 Adventure</h1><p>50 fun missions: shapes, numbers, letters, CVC words, reading and everyday English.</p><p>⭐ Earn XP &nbsp; 🔥 Build streaks &nbsp; ❤️ Keep hearts &nbsp; 🏆 Unlock 5 worlds</p><button class="go" onclick="start()">START GAME</button></div>';
</script></body></html>
