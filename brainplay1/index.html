<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Grade 1 Brain Play</title><style>:root{--ink:#fff;--muted:#cfe0ff;--accent:#ffd84f;--good:#31da86;--bad:#ff637c}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Arial,sans-serif;background:linear-gradient(180deg,#4b74e6 0,#1f3c8b 35%,#081327 100%);color:white;min-height:100vh;overflow-x:hidden}.app{max-width:980px;margin:auto;min-height:100vh;padding:14px;display:flex;flex-direction:column}.top{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}.brand{font-size:clamp(24px,5vw,40px);font-weight:1000}.stats{display:flex;gap:7px;flex-wrap:wrap}.pill{background:#ffffff18;border:1px solid #ffffff2c;padding:8px 11px;border-radius:999px;font-weight:900}.prog{height:14px;background:#ffffff20;border-radius:20px;overflow:hidden;margin:12px 0}.bar{height:100%;width:0;background:linear-gradient(90deg,#40e196,#ffe25c);transition:.3s}.card{flex:1;background:linear-gradient(145deg,#173a78,#0c224b);border:1px solid #ffffff28;box-shadow:0 24px 70px #0008;border-radius:30px;padding:clamp(20px,5vw,42px);display:flex;flex-direction:column;justify-content:center;position:relative;overflow:hidden}.level{color:var(--accent);font-weight:1000;text-transform:uppercase}.q{font-size:clamp(25px,4.2vw,42px);font-weight:1000;line-height:1.13;margin:10px 0 14px}.v{white-space:pre-line;text-align:center;font-size:clamp(36px,8vw,68px);padding:16px;background:#ffffff0d;border-radius:22px;margin-bottom:17px}.opts{display:grid;grid-template-columns:repeat(2,1fr);gap:11px}.opt,.dragitem,.paintitem{border:2px solid #ffffff28;background:#ffffff12;color:#fff;border-radius:18px;padding:16px;font-size:clamp(18px,2.5vw,22px);font-weight:900;cursor:pointer}.opt:hover,.dragitem:hover,.paintitem:hover{background:#ffffff20;transform:translateY(-2px)}.opt.good{background:#12814a;border-color:#6af0ad}.opt.bad{background:#8f2941;border-color:#ff8ea3}.dropzone{min-height:100px;border:3px dashed #ffffff55;border-radius:20px;display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:1000;margin-bottom:12px;background:#ffffff08}.dragrow,.paintrow{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}.dragitem{min-width:90px}.dragitem.dragging{opacity:.35}.paintitem{min-width:72px;font-size:30px}.paintitem.on{background:#ffd84f33;outline:3px solid var(--accent)}.feedback{margin-top:14px;background:#06142fbb;border-radius:16px;padding:12px 15px;color:var(--muted);min-height:62px}.feedback strong{color:#fff}.actions{display:flex;justify-content:flex-end;gap:10px;margin-top:10px}.btn,.go{border:0;border-radius:15px;background:var(--accent);padding:13px 20px;font-size:17px;font-weight:1000;cursor:pointer}.secondary{background:#fff}.start,.finish{text-align:center}.hero{font-size:90px}.start h1,.finish h1{font-size:clamp(34px,7vw,64px);margin:5px}.start p,.finish p{color:var(--muted);font-size:19px;max-width:720px;margin:10px auto 18px}.resume{background:#ffffff14;border:1px solid #ffffff2b;border-radius:18px;padding:13px;margin:16px auto;max-width:560px}.full{position:fixed;right:10px;bottom:10px;z-index:9;border:1px solid #ffffff38;background:#0c224bdc;color:#fff;border-radius:999px;padding:9px 12px}.badge{position:absolute;right:18px;top:18px;font-size:48px;opacity:.17}.confetti{position:absolute;inset:0;pointer-events:none}.confetti span{position:absolute;top:-30px;font-size:24px;animation:fall 1.1s ease-out forwards}@keyframes fall{to{transform:translateY(650px) rotate(520deg);opacity:0}}@media(max-width:640px){.opts{grid-template-columns:1fr}.card{border-radius:22px}.v{font-size:46px}.paintitem{min-width:58px}}</style></head><body><main class="app"><div class="top"><div class="brand">🎨 Grade 1 Brain Play</div><div class="stats"><span class="pill">⭐ <b id="xp">0</b></span><span class="pill">🔥 <b id="st">0</b></span><span class="pill">❤️ <b id="hp">5</b></span><span class="pill"><b id="num">0</b>/50</span></div></div><div class="prog"><div class="bar" id="bar"></div></div><section class="card" id="card"></section></main><button class="full" onclick="toggleFull()">⛶</button><script>const Q=[{"t":"tap","q":"Tap the BIGGEST animal.","v":"🐭 🐘 🐱","opts":["🐭 Mouse","🐘 Elephant","🐱 Cat"],"a":"🐘 Elephant","hint":"The elephant is the biggest."},{"t":"tap","q":"Tap the SMALLEST object.","v":"🏠 🚗 🍎","opts":["🏠 House","🚗 Car","🍎 Apple"],"a":"🍎 Apple","hint":"The apple is the smallest."},{"t":"drag","q":"Drag the number to the box that makes 3 + ? = 5.","v":"3 + ⬜ = 5","items":["1","2","3"],"a":"2","hint":"3 + 2 = 5."},{"t":"paint","q":"Paint exactly 3 stars.","v":"⭐ ⭐ ⭐ ⭐ ⭐","a":3,"hint":"You need exactly 3 stars."},{"t":"pattern","q":"What comes next?","v":"🔴 🔵 🔴 🔵 ?","opts":["🔴","🔵","🟢"],"a":"🔴","hint":"The colors alternate."},{"t":"tap","q":"Which number comes AFTER 7?","v":"6 7 ?","opts":["5","8","9"],"a":"8","hint":"7, then 8."},{"t":"tap","q":"Which number comes BEFORE 10?","v":"? 10","opts":["8","9","11"],"a":"9","hint":"9 comes before 10."},{"t":"drag","q":"Drag the shape into the matching hole.","v":"Hole: ◯","items":["◯","□","△"],"a":"◯","hint":"A circle fits a circle hole."},{"t":"paint","q":"Color all the circles.","v":"● ■ ● ▲ ●","mask":[1,0,1,0,1],"a":3,"hint":"There are 3 circles."},{"t":"tap","q":"Which shape has 3 sides?","v":"△ □ ○","opts":["Triangle","Square","Circle"],"a":"Triangle","hint":"A triangle has 3 sides."},{"t":"tap","q":"The bird is ___ the tree.","v":"🐦\n🌳","opts":["above","below"],"a":"above","hint":"The bird is above the tree."},{"t":"tap","q":"The fish is ___ the boat.","v":"🚤\n🐟","opts":["above","below"],"a":"below","hint":"The fish is below the boat."},{"t":"drag","q":"Drag the LONG object to the box.","v":"Long box ⬜","items":["✏️ Pencil","🧽 Eraser"],"a":"✏️ Pencil","hint":"The pencil is longer."},{"t":"paint","q":"Paint 4 balloons.","v":"🎈 🎈 🎈 🎈 🎈 🎈","a":4,"hint":"Choose exactly 4 balloons."},{"t":"pattern","q":"Continue the pattern.","v":"⭐ ⭐ 🌙 ⭐ ⭐ 🌙 ?","opts":["⭐","🌙","☀️"],"a":"⭐","hint":"The pattern is star, star, moon."},{"t":"tap","q":"Which group has MORE?","v":"🍎🍎🍎 vs 🍌🍌","opts":["Apples","Bananas"],"a":"Apples","hint":"3 is more than 2."},{"t":"tap","q":"Which group has LESS?","v":"🐶🐶 vs 🐱🐱🐱🐱","opts":["Dogs","Cats"],"a":"Dogs","hint":"2 is less than 4."},{"t":"drag","q":"Drag 6 into the correct place.","v":"5 ⬜ 7","items":["4","6","8"],"a":"6","hint":"5, 6, 7."},{"t":"tap","q":"Which number is EVEN?","v":"3 4 5","opts":["3","4","5"],"a":"4","hint":"4 can be split into 2 equal groups."},{"t":"tap","q":"Which number is ODD?","v":"2 6 7","opts":["2","6","7"],"a":"7","hint":"7 is odd."},{"t":"tap","q":"Which word starts with S?","v":"☀️ 🐱 🎩","opts":["sun","cat","hat"],"a":"sun","hint":"Sun starts with S."},{"t":"tap","q":"Which word starts with H?","v":"🎩 🐀 ☀️","opts":["hat","rat","sun"],"a":"hat","hint":"Hat starts with H."},{"t":"drag","q":"Build CAT: drag the missing letter.","v":"C _ T","items":["A","O","U"],"a":"A","hint":"C-A-T spells CAT."},{"t":"drag","q":"Build SUN: drag the missing letter.","v":"S _ N","items":["A","U","E"],"a":"U","hint":"S-U-N spells SUN."},{"t":"pattern","q":"Which word belongs to the -at family?","v":"rat, hat, ?","opts":["cat","sun","dog"],"a":"cat","hint":"Rat, hat and cat all end with -at."},{"t":"tap","q":"Which picture is a CAT?","v":"🐶 🐱 🐭","opts":["🐶","🐱","🐭"],"a":"🐱","hint":"🐱 is a cat."},{"t":"tap","q":"Which picture is a SUN?","v":"🌙 ☀️ ⭐","opts":["🌙","☀️","⭐"],"a":"☀️","hint":"☀️ is the sun."},{"t":"paint","q":"Paint ONLY the letters H and h.","v":"H S h U H","mask":[1,0,1,0,1],"a":3,"hint":"H and h are the same letter family."},{"t":"tap","q":"Which is lowercase u?","v":"U u h","opts":["U","u","h"],"a":"u","hint":"Lowercase U is u."},{"t":"tap","q":"Which is uppercase S?","v":"s S h","opts":["s","S","h"],"a":"S","hint":"Uppercase S is S."},{"t":"tap","q":"Which sentence matches the picture?","v":"🙂 🍕","opts":["I like pizza.","I don't like pizza."],"a":"I like pizza.","hint":"The happy face means 'I like'."},{"t":"tap","q":"Which sentence matches the picture?","v":"🙁 🔊","opts":["I like loud sounds.","I don't like loud sounds."],"a":"I don't like loud sounds.","hint":"The sad face means 'I don't like'."},{"t":"drag","q":"Drag the correct word to the picture.","v":"🏫 = ⬜","items":["school","pizza","swimming"],"a":"school","hint":"🏫 means school."},{"t":"drag","q":"Drag the correct word to the picture.","v":"🏊 = ⬜","items":["reading","swimming","maths"],"a":"swimming","hint":"🏊 means swimming."},{"t":"tap","q":"Which one does NOT belong?","v":"🍎 🍌 🍕 🍊","opts":["🍎","🍌","🍕","🍊"],"a":"🍕","hint":"Pizza is not a fruit."},{"t":"tap","q":"Which one does NOT belong?","v":"🐶 🐱 🐭 🚗","opts":["🐶","🐱","🐭","🚗"],"a":"🚗","hint":"The car is not an animal."},{"t":"pattern","q":"What comes next?","v":"1, 2, 1, 2, 1, ?","opts":["1","2","3"],"a":"2","hint":"The pattern repeats 1, 2."},{"t":"paint","q":"Paint all the RED things.","v":"🔴 🔵 🔴 🟢 🔴","mask":[1,0,1,0,1],"a":3,"hint":"There are 3 red circles."},{"t":"tap","q":"If you have 2 apples and get 1 more, how many?","v":"🍎🍎 + 🍎","opts":["2","3","4"],"a":"3","hint":"2 + 1 = 3."},{"t":"tap","q":"If you have 5 candies and eat 2, how many are left?","v":"🍬🍬🍬🍬🍬 - 2","opts":["2","3","4"],"a":"3","hint":"5 - 2 = 3."},{"t":"tap","q":"A robot faces up. It turns right. Which way now?","v":"🤖 ↑ ↱","opts":["←","→","↓"],"a":"→","hint":"Right from up points right."},{"t":"tap","q":"Which path is shortest?","v":"A → B: 2 steps\nA → C → B: 4 steps","opts":["A→B","A→C→B"],"a":"A→B","hint":"2 steps is shorter than 4."},{"t":"drag","q":"Put the SMALL number into the box.","v":"⬜","items":["9","3"],"a":"3","hint":"3 is smaller than 9."},{"t":"drag","q":"Put the BIG number into the box.","v":"⬜","items":["4","8"],"a":"8","hint":"8 is bigger than 4."},{"t":"tap","q":"Which pair is the SAME?","v":"🔺🔺 🔺🔵 🔵🔺","opts":["🔺🔺","🔺🔵","🔵🔺"],"a":"🔺🔺","hint":"Both shapes are triangles."},{"t":"tap","q":"Which picture shows 4?","v":"●●● ●●●● ●●","opts":["●●●","●●●●","●●"],"a":"●●●●","hint":"Four dots = 4."},{"t":"paint","q":"Paint exactly HALF of these 6 circles.","v":"⚪ ⚪ ⚪ ⚪ ⚪ ⚪","a":3,"hint":"Half of 6 is 3."},{"t":"pattern","q":"Finish the growing pattern.","v":"⭐ ⭐⭐ ⭐⭐⭐ ?","opts":["⭐⭐","⭐⭐⭐⭐","⭐⭐⭐⭐⭐"],"a":"⭐⭐⭐⭐","hint":"One star is added each time."},{"t":"tap","q":"Which clue is true?","v":"🐘 🐭","opts":["Mouse is bigger","Elephant is bigger","They are same size"],"a":"Elephant is bigger","hint":"An elephant is much bigger than a mouse."},{"t":"tap","q":"FINAL BOSS: Which answer makes BOTH clues true?","v":"It is greater than 4.\nIt is less than 6.","opts":["3","5","7"],"a":"5","hint":"5 is the only number between 4 and 6."}],KEY="grade1_brainplay_v1";let i=0,xp=0,st=0,hp=5,answers={},locked=false,paintSel=[],dropped=null;const $=x=>document.getElementById(x),card=$("card");function save(){localStorage.setItem(KEY,JSON.stringify({i,xp,st,hp,answers}))}function load(){try{let s=JSON.parse(localStorage.getItem(KEY));if(s){i=s.i||0;xp=s.xp||0;st=s.st||0;hp=s.hp??5;answers=s.answers||{};return true}}catch(e){}return false}function resetGame(){localStorage.removeItem(KEY);i=0;xp=0;st=0;hp=5;answers={};render()}function startNew(){i=0;xp=0;st=0;hp=5;answers={};save();render()}function resume(){render()}function upd(){$("xp").textContent=xp;$("st").textContent=st;$("hp").textContent=hp;$("num").textContent=Math.min(i,50);$("bar").style.width=(Math.min(i,50)*2)+"%"}function render(){locked=false;paintSel=[];dropped=null;upd();if(i>=50)return finish();const q=Q[i];let body="";if(["tap","pattern"].includes(q.t))body=`<div class="opts">${q.opts.map((o,k)=>`<button class="opt" data-k="${k}">${o}</button>`).join("")}</div>`;if(q.t==="drag")body=`<div class="dropzone" id="dropzone">Drop here ⬇️</div><div class="dragrow">${q.items.map((o,k)=>`<div class="dragitem" draggable="true" data-k="${k}">${o}</div>`).join("")}</div>`;if(q.t==="paint"){let tokens=q.v.split(" ");body=`<div class="paintrow">${tokens.map((o,k)=>`<button class="paintitem" data-k="${k}">${o}</button>`).join("")}</div>`}card.innerHTML=`<div class="badge">${["🧠","🎨","🧩","🚀","🏆"][Math.floor(i/10)]}</div><div class="level">Mission ${i+1} · Brain Play</div><div class="q">${q.q}</div>${q.t==="paint"?"":`<div class="v">${q.v}</div>`}${body}<div class="feedback" id="fb">💡 ${q.t==="drag"?"Drag the correct item into the box.":q.t==="paint"?"Tap to paint. Tap again to unpaint.":"Think, then choose."}</div><div class="actions" id="act"></div>`;bind(q)}function bind(q){if(["tap","pattern"].includes(q.t))document.querySelectorAll(".opt").forEach(b=>b.onclick=()=>gradeChoice(b,q));if(q.t==="drag"){const dz=$("dropzone");document.querySelectorAll(".dragitem").forEach(el=>{el.addEventListener("dragstart",()=>{el.classList.add("dragging");dropped=q.items[+el.dataset.k]});el.addEventListener("dragend",()=>el.classList.remove("dragging"));el.onclick=()=>{dropped=q.items[+el.dataset.k];dz.textContent=dropped;$("act").innerHTML='<button class="btn" onclick="gradeDrag()">CHECK ✓</button>'}});dz.addEventListener("dragover",e=>e.preventDefault());dz.addEventListener("drop",e=>{e.preventDefault();dz.textContent=dropped;$("act").innerHTML='<button class="btn" onclick="gradeDrag()">CHECK ✓</button>'})}if(q.t==="paint"){document.querySelectorAll(".paintitem").forEach(b=>b.onclick=()=>{b.classList.toggle("on");let k=+b.dataset.k;if(paintSel.includes(k))paintSel=paintSel.filter(x=>x!==k);else paintSel.push(k)});$("act").innerHTML='<button class="btn" onclick="gradePaint()">CHECK ✓</button>'}}function gradeChoice(btn,q){if(locked)return;locked=true;let val=q.opts[+btn.dataset.k],ok=val===q.a;document.querySelectorAll(".opt").forEach((b,k)=>{b.disabled=true;if(q.opts[k]===q.a)b.classList.add("good")});if(!ok)btn.classList.add("bad");result(ok,q,val)}function gradeDrag(){if(locked||dropped===null)return;let q=Q[i];locked=true;result(dropped===q.a,q,dropped)}function gradePaint(){if(locked)return;let q=Q[i];locked=true;let ok=false;if(q.mask){let target=q.mask.map((x,k)=>x?k:null).filter(x=>x!==null).sort().join(",");ok=[...paintSel].sort((a,b)=>a-b).join(",")===target}else ok=paintSel.length===q.a;result(ok,q,paintSel)}function result(ok,q,val){answers[i]={ok,val};if(ok){st++;let gain=100+Math.min(st,5)*20;xp+=gain;$("fb").innerHTML=`✅ <strong>Great! +${gain} XP</strong><br>${q.hint}`;confetti()}else{st=0;hp=Math.max(0,hp-1);$("fb").innerHTML=`❌ <strong>Try this idea:</strong><br>${q.hint}`}$("act").innerHTML='<button class="btn secondary" onclick="next()">Next ➜</button>';save();upd()}function next(){i++;save();render()}function confetti(){let c=document.createElement("div");c.className="confetti";for(let j=0;j<14;j++){let s=document.createElement("span");s.textContent=["⭐","✨","🎉","🎈"][j%4];s.style.left=(Math.random()*95)+"%";s.style.animationDelay=(Math.random()*.2)+"s";c.appendChild(s)}card.appendChild(c);setTimeout(()=>c.remove(),1200)}function finish(){upd();$("num").textContent=50;$("bar").style.width="100%";let good=Object.values(answers).filter(x=>x.ok).length;let wrong=50-good;card.innerHTML=`<div class="finish"><div class="hero">🏆</div><h1>Brain Play Complete!</h1><p>You finished all 50 missions.</p><h2>✅ ${good}/50 correct</h2><p>❌ ${wrong} to practice again · ⭐ ${xp} XP</p><button class="go" onclick="resetGame()">🔄 Start Again</button></div>`;save()}function toggleFull(){if(!document.fullscreenElement)document.documentElement.requestFullscreen?.();else document.exitFullscreen?.()}const has=load();upd();if(has&&i>0&&i<50){card.innerHTML=`<div class="start"><div class="hero">🎮</div><h1>Welcome Back!</h1><div class="resume">Your progress is saved on this device.<br><b>Mission ${i+1} of 50 · ⭐ ${xp} XP</b></div><button class="go" onclick="resume()">▶ Continue</button> <button class="go" onclick="startNew()">↺ New Game</button></div>`}else{card.innerHTML=`<div class="start"><div class="hero">🎨🧠</div><h1>Grade 1 Brain Play</h1><p>50 playful logic missions with tapping, drag & drop, painting, patterns and puzzles.</p><p>Your progress and answers are saved automatically on this device.</p><button class="go" onclick="startNew()">START PLAYING</button></div>`}</script></body></html>
