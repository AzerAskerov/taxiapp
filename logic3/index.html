<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Grade 3 Logic Quest</title><style>body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(#183d7a,#071225);color:white;min-height:100vh}.a{max-width:920px;margin:auto;padding:14px}.t{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:center}.b{font-size:30px;font-weight:900}.s{display:flex;gap:6px;flex-wrap:wrap}.p{background:#ffffff18;padding:8px 10px;border-radius:30px;font-weight:800}.pr{height:12px;background:#ffffff20;border-radius:20px;overflow:hidden;margin:12px 0}.bar{height:100%;background:linear-gradient(90deg,#35d889,#ffd85c);width:0}.ws{display:flex;justify-content:space-between;margin-bottom:10px}.w{opacity:.35;text-align:center}.w.on{opacity:1}.w span{font-size:24px;display:block}.c{background:#102a56;border:1px solid #ffffff28;border-radius:26px;padding:30px;min-height:68vh;display:flex;flex-direction:column;justify-content:center}.tag{color:#ffd85c;font-weight:900}.q{font-size:32px;font-weight:900;margin:12px 0}.v{text-align:center;font-size:50px;background:#ffffff0c;border-radius:18px;padding:14px;white-space:pre-line}.o{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}.x,.z,.btn{border:2px solid #ffffff22;background:#ffffff12;color:white;border-radius:16px;padding:15px;font-size:19px;font-weight:800}.x.sel{outline:3px solid #ffd85c}.x.good{background:#13814b}.x.bad{background:#8d2840}.f{background:#06142d99;border-radius:14px;padding:12px;margin-top:12px;color:#cbd8f8;min-height:42px}.act{text-align:right;margin-top:10px}.btn{background:#ffd85c;color:#111;border:0;cursor:pointer}.build{border:2px dashed #ffffff44;border-radius:16px;padding:16px;text-align:center;font-size:25px;margin-top:12px}.tiles{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:10px}.z.used{opacity:.25}.start,.finish{text-align:center}.hero{font-size:80px}.go{background:#ffd85c;border:0;border-radius:16px;padding:15px 22px;font-size:20px;font-weight:900}@media(max-width:620px){.o{grid-template-columns:1fr}.q{font-size:25px}.v{font-size:40px}.w b{display:none}.c{padding:20px}}</style></head><body><main class="a"><div class="t"><div class="b">🧠 Grade 3 Logic Quest</div><div class="s"><span class="p">⭐ <b id="xp">0</b></span><span class="p">🔥 <b id="st">0</b></span><span class="p">❤️ <b id="hp">5</b></span><span class="p"><b id="n">0</b>/50</span></div></div><div class="pr"><div class="bar" id="bar"></div></div><div class="ws" id="ws"></div><section class="c" id="c"></section></main><script src="q1.js"></script><script src="q2.js"></script><script>const W=['Pattern Forest','Shape City','Word Detective','Logic Lab','Detective Tower'],I=['🌲','🏙️','🕵️','🧪','🏰'];let i=0,xp=0,st=0,hp=5,L=false,M=[],S=[],$=x=>document.getElementById(x),c=$('c');function init(){$('ws').innerHTML=W.map((w,k)=>`<div class=w id=w${k}><span>${I[k]}</span><b>${w}</b></div>`).join('');home()}function u(){$('xp').textContent=xp;$('st').textContent=st;$('hp').textContent=hp;$('n').textContent=Math.min(i,50);$('bar').style.width=Math.min(i,50)*2+'%';W.forEach((w,k)=>$('w'+k).classList.toggle('on',i>=k*10))}function home(){u();c.innerHTML='<div class=start><div class=hero>🧠🚀</div><h1>Grade 3 Logic Quest</h1><p>50 brain missions: patterns, shapes, word logic, real-life reasoning and deduction.</p><button class=go onclick=start()>START QUEST</button></div>'}function start(){i=xp=st=0;hp=5;r()}function r(){L=false;M=[];S=[];u();if(i>=50)return fin();let q=Q[i],b='';if(q.type==='choice'||q.type==='multi')b='<div class=o>'+q.opts.map((x,k)=>`<button class=x data-k=${k}>${x}</button>`).join('')+'</div>';else b='<div class=build id=build>Tap in the correct order</div><div class=tiles>'+q.items.map((x,k)=>`<button class=z data-k=${k}>${x}</button>`).join('')+'</div>';c.innerHTML=`<div class=tag>${q.icon} ${q.w} · Mission ${i+1}</div><div class=q>${q.q}</div><div class=v>${q.visual||''}</div>${b}<div class=f id=f>💡 ${q.type==='multi'?'Choose all correct answers, then CHECK.':q.type==='sequence'?'Tap items in order.':'Choose the best answer.'}</div><div class=act id=act></div>`;bind(q)}function bind(q){if(q.type==='choice')document.querySelectorAll('.x').forEach(b=>b.onclick=()=>gc(b,q));if(q.type==='multi'){document.querySelectorAll('.x').forEach(b=>b.onclick=()=>{if(L)return;b.classList.toggle('sel');M=[...document.querySelectorAll('.x.sel')].map(x=>q.opts[+x.dataset.k])});$('act').innerHTML='<button class=btn onclick=gm()>CHECK ✓</button>'}if(q.type==='sequence')document.querySelectorAll('.z').forEach(b=>b.onclick=()=>{if(L||b.classList.contains('used'))return;b.classList.add('used');S.push(q.items[+b.dataset.k]);$('build').textContent=S.join(' → ');if(S.length===q.a.length)res(S.join('|')===q.a.join('|'),q)})}function gc(b,q){if(L)return;L=true;let ok=q.opts[+b.dataset.k]===q.a;document.querySelectorAll('.x').forEach((x,k)=>{x.disabled=true;if(q.opts[k]===q.a)x.classList.add('good')});if(!ok)b.classList.add('bad');res(ok,q)}function gm(){if(L)return;let q=Q[i];L=true;let ok=[...M].sort().join('|')===[...q.a].sort().join('|');document.querySelectorAll('.x').forEach((b,k)=>{b.disabled=true;if(q.a.includes(q.opts[k]))b.classList.add('good');else if(b.classList.contains('sel'))b.classList.add('bad')});res(ok,q)}function res(ok,q){if(ok){st++;let g=100+Math.min(st,5)*20;xp+=g;$('f').innerHTML=`✅ <b>Correct! +${g} XP</b><br>${q.hint}`}else{st=0;hp=Math.max(0,hp-1);$('f').innerHTML=`❌ <b>Good try!</b><br>${q.hint}`}$('act').innerHTML='<button class=btn onclick=nx()>Next ➜</button>';u()}function nx(){i++;r()}function fin(){u();$('n').textContent=50;$('bar').style.width='100%';c.innerHTML=`<div class=finish><div class=hero>🏆</div><h1>Quest Complete!</h1><h2>${xp>=6200?'🏆 LOGIC MASTER':xp>=5400?'🥇 SUPER THINKER':xp>=4600?'🥈 PUZZLE EXPLORER':'🥉 BRAVE SOLVER'}</h2><p style="font-size:28px">⭐ ${xp} XP</p><button class=go onclick=start()>Play Again</button></div>`}init()</script></body></html>
